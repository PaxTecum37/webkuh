<!DOCTYPE html>
{% load static %}

<html lang="hr">

<head>
        <link rel="stylesheet" href="{% static 'recipes/style.css' %}">
        <link rel="stylesheet" href="{% static 'recipes/detail.css' %}">
        <meta charset="UTF-8">
        <title>{% block title %}WebKuh{% endblock %}</title>
</head>

<body>

<nav>
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'recipes:list' %}">Recepti</a>
    <a href="{% url 'recipes:placeholder' %}">Test</a>

    <span style="float:right;">
        {% if user.is_authenticated %}
            <span style="color: white;">Bok, {{ user.username }}</span>
            
            <form action="{% url 'accounts:logout' %}" method="post" style="display:inline ;">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        {% else %}
            <a href="{% url 'accounts:login' %}">Login</a>
            <a href="{% url 'accounts:register' %}">Register</a>
        {% endif %}

    </span>
</nav>

<hr>
<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
